[SeuratClusterStats.envs.features."FigE4b (Expression of selected genes)"]
plot_type = "violin"
features = [
  "CD8A", "GZMH", "GZMK", "ITGAE", "ZNF683", "CD69", "XCL1", "KLRC2", "KLRC3",
  "KLRD1", "KLRC1", "MALAT1", "CHD1", "HMGN2", "KLRB1", "IL7R", "S100A6", "RPL32",
  "TCF7", "FOS", "TNFRSF4",
]
facet_ncol = 4

[SeuratClusterStats.envs.features."FigE4c (Trm sig)"]
features = "Trm_sig"
plot_type = "violin"
add_stat = "mean"

[SeuratClusterStats.envs.features."FigE4d (PD1 expr)"]
features = "PDCD1"
plot_type = "violin"
add_stat = "mean"

[SeuratClusterStats.envs.features."FigE4e (Term ex)"]
features = "Term_ex"
plot_type = "violin"
add_stat = "mean"

[SeuratClusterStats.envs.stats."FigE4f (Tumour pct)"]
agg = "sum(Source == 'Tumor') / sum(Source != 'Blood')"
plot_type = "bar"

[SeuratClusterStats.envs.features."Clone Sizes"]
features = "clonalFrequency"
plot_type = "dim"
devpars = { width = 1000, height = 800 }

[SeuratClusterStats.envs.stats."Clonotype Fraction"]
agg = "sum(!is.na(CTaa)) / n()"
plot_type = "bar"
devpars = { width = 1000, height = 600 }

[SeuratClusterStats.envs.dimplots.Identity]
label = true

[SeuratClusterStats.envs.dimplots.Source]
subset = "Source != 'Blood'"
group_by = "Source"

[SeuratClusterStats.envs.dimplots.Patient]
group_by = "Patient"

[ModuleScoreCalculator.envs.modules.Trm_sig]
features = [
  "CA10","ITGA1","ITGAE","IL2","IL10","CXCR6","CXCL13","KCNK5",
  "RGS1","CRTAM","DUSP6","PDCD1","IL23R",
  "STK38","TTC16","SELL","KLF3","KLF2",
  "NSG1", #"D4S234E" (GeneID:27065)
  "SBK1","FAM65B","TTYH2","NPDC1","KRT72","S1PR1",
  "SOX13","KRT73","TSPAN18","PTGDS","RAP1GAP2","CX3CR1"
]

[ModuleScoreCalculator.envs.modules.Term_ex]
features = [
  "CXCR5",
  "HAVCR2" # "TIM3"
]

[SeuratClusterStats.envs.stats."Distribution of Top 10 Clones (Renal1)"]
plot_type = "pies"
group_by = "Patient"
rows_name = "Clones"
rows_by = "Renal1_Top10Clones"
values_by = "One"
rows_orderby = "-sum(clonalFrequency)"

[SeuratClusterStats.envs.stats."Distribution of Top 10 Clones (Renal2)"]
plot_type = "pies"
group_by = "Patient"
rows_name = "Clones"
rows_by = "Renal2_Top10Clones"
values_by = "One"
rows_orderby = "-sum(clonalFrequency)"
devpars = { height = 4000 }

[SeuratClusterStats.envs.stats."Distribution of Top 10 Clones (Renal3)"]
plot_type = "pies"
group_by = "Patient"
rows_name = "Clones"
rows_by = "Renal3_Top10Clones"
values_by = "One"
rows_orderby = "-sum(clonalFrequency)"
devpars = { height = 4000 }

[SeuratClusterStats.envs.stats."Distribution of Top 10 Clones (Lung6)"]
plot_type = "pies"
group_by = "Patient"
rows_name = "Clones"
rows_by = "Lung6_Top10Clones"
values_by = "One"
rows_orderby = "-sum(clonalFrequency)"
devpars = { height = 4000 }