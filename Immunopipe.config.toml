# Immunopipe v2.5.3
[plugin_opts]
args_dump = true

[SampleInfo.in]
infile = [ "data/samples.txt" ]

[SampleInfo.envs.stats."Samples per Sex"]
group_by = "Sex"
subset = "!duplicated(Patient)"
x = "Patient"

[SampleInfo.envs.stats."Samples per Source"]
group_by = "Source"
x = "Sample"

[SampleInfo.envs.stats."Age Distribution"]
plot_type = "histogram"
x = "Age"
subset = "!duplicated(Patient)"

[SeuratPreparing.envs]
cache = "./.cache"
ncores = 4
use_sct = true

[SeuratClusteringOfAllCells.envs.FindClusters]
resolution = 1.6
cache = "./.cache"

[ClusterMarkersOfAllCells.envs]
cache = "./.cache"

[TOrBCellSelection.envs]
indicator_genes = [ "CD3E", "CD3D", "CD3G", "CD14", "CD68" ]

[SeuratClustering.envs]
ncores = 4
cache = "./.cache"

[SeuratClustering.envs.FindClusters]
# expecting 16 clusters
resolution = [0.7, 0.75, 0.71]

[SeuratClusterStats.envs]
cache = "./.cache"

[SeuratClusterStats.envs.mutaters]
One = '1'
Renal1_Top10Clones = 'top(10, within = Patient == "Renal1", output_within = TRUE)'
Renal2_Top10Clones = 'top(10, within = Patient == "Renal2", output_within = TRUE)'
Renal3_Top10Clones = 'top(10, within = Patient == "Renal3", output_within = TRUE)'
Lung6_Top10Clones = 'top(10, within = Patient == "Lung6", output_within = TRUE)'

[ClonalStats.envs]
cache = "./.cache"

[ClonalStats.envs.mutaters]
# Mark blood clones
BloodExpanded = '''
  or(
    gt("RB1", 1, group_by = "Sample", output = "bool"),
    gt("RB2", 1, group_by = "Sample", output = "bool"),
    gt("RB3", 1, group_by = "Sample", output = "bool"),
    gt("LB6", 1, group_by = "Sample", output = "bool")
  )
'''
BloodNonExpanded = '''
  or(
    eq("RB1", 1, group_by = "Sample", output = "bool"),
    eq("RB2", 1, group_by = "Sample", output = "bool"),
    eq("RB3", 1, group_by = "Sample", output = "bool"),
    eq("LB6", 1, group_by = "Sample", output = "bool")
  )
'''
BloodIndependent = '''
  or(
    eq("RB1", 0, group_by = "Sample", output = "bool"),
    eq("RB2", 0, group_by = "Sample", output = "bool"),
    eq("RB3", 0, group_by = "Sample", output = "bool"),
    eq("LB6", 0, group_by = "Sample", output = "bool")
  )
'''

[ClonalStats.envs.cases.Fig1a]
viz_type = "residency"
group_by = "Source"
groups = [ "NAT", "Tumor" ]
split_by = "Patient"
subset = 'Patient %in% c("Renal1", "Renal2", "Renal3", "Lung6")'

[ClonalStats.envs.cases.Fig1f]
viz_type = "residency"
group_by = "Source"
groups = [ "Blood", "Tumor" ]
subset = 'Patient %in% c("Renal1", "Renal2", "Renal3", "Lung6")'

[ClonalStats.envs.cases."Fig2c (blood-independent)"]
viz_type = "residency"
group_by = "Source"
groups = [ "NAT", "Tumor" ]
subset = 'BloodIndependent & seurat_clusters %in% c("c1", "c6", "c2", "c7", "c8")'
split_by = "seurat_clusters"

[ClonalStats.envs.cases."Fig2c (blood-nonexpanded)"]
viz_type = "residency"
group_by = "Source"
groups = [ "NAT", "Tumor" ]
subset = 'BloodNonExpanded & seurat_clusters %in% c("c1", "c6", "c2", "c7", "c8")'
split_by = "seurat_clusters"

[ClonalStats.envs.cases."Fig2c (blood-expanded)"]
viz_type = "residency"
group_by = "Source"
groups = [ "NAT", "Tumor" ]
subset = 'BloodExpanded & seurat_clusters %in% c("c1", "c6", "c2", "c7", "c8")'
split_by = "seurat_clusters"

[ClonalStats.envs.cases."FigE2 (Tumor vs Blood)"]
viz_type = "residency"
group_by = "Source"
groups = [ "Blood", "Tumor" ]
split_by = "Patient"

[ClonalStats.envs.cases."FigE2 (NAT vs Tumor)"]
viz_type = "residency"
group_by = "Source"
groups = [ "NAT", "Tumor" ]
split_by = "Patient"

[ClonalStats.envs.cases."FigE5"]
viz_type = "residency"
group_by = "Source"
groups = [ "NAT", "Tumor" ]
split_by = "seurat_clusters"

[ClusterMarkers.envs]
cache = "./.cache"
ncores = 4
sigmarkers = "p_val_adj < 0.05 & avg_log2FC > 0.1"

